name: Keep Supabase alive

# 1) Empêche la mise en pause du projet Supabase (plan gratuit : pause après 7 jours
#    sans activité) en interrogeant la base 2 fois par semaine.
# 2) Empêche GitHub de désactiver ce workflow planifié (désactivé après 60 jours
#    sans commit) : un commit "à vide" est fait automatiquement si le dépôt approche
#    des 50 jours d'inactivité. Seul un nouveau commit réarme ce délai côté GitHub.

on:
  schedule:
    - cron: '0 6 * * 1,4'   # tous les lundis et jeudis à 06h00 UTC
  workflow_dispatch:          # bouton pour lancer manuellement (test)

permissions:
  contents: write             # nécessaire pour le commit de maintien

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Ping de la base Supabase
        run: |
          URL="https://tmtykunuhflrygbiwzka.supabase.co/rest/v1/products?select=id&limit=1"
          KEY="sb_publishable_Y-S6kayOP_rjm4EkxuwnuA_NmEl0wtN"
          code=$(curl -sS -o /dev/null -w "%{http_code}" "$URL" -H "apikey: $KEY")
          echo "Supabase a répondu : HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Le ping a échoué (HTTP $code). Le projet est peut-être en pause : ouvrez le tableau de bord Supabase pour le réactiver."
            exit 1
          fi
          echo "OK : la base est active, le compteur d'inactivité est réarmé."

      - name: Garder ce workflow actif (commit de maintien si dépôt inactif)
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "Dernier commit il y a $days jour(s)."
          if [ "$days" -ge 50 ]; then
            echo "Inactivité proche de la limite GitHub : commit de maintien."
            git config user.name "keepalive-bot"
            git config user.email "actions@github.com"
            git commit --allow-empty -m "chore: keepalive (maintien du workflow planifie)"
            git push
          else
            echo "Activite recente, aucun commit necessaire."
          fi
